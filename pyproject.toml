[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuyha"
version = "0.1.0"
description = "CLI-only TuyHA artifact materializer"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=48.0.1",
    "pycryptodome>=3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
tuyha = "tuyha.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
